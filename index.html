<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>网络舆情监测报告 · 临时发布</title>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
  --accent:#1e5aa8; --accent-soft:#e8f0fa; --warn:#b45309; --warn-soft:#fef3c7;
  --danger:#b91c1c; --danger-soft:#fee2e2; --ok:#166534; --ok-soft:#dcfce7;
  --c1:#1e5aa8; --c2:#e11d48; --c3:#d97706; --c4:#059669; --c5:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.75}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 60px}
header.site{background:linear-gradient(135deg,#123c6e,#1e5aa8);color:#fff;padding:28px 16px 22px}
header.site .wrap{padding-bottom:0}
header.site h1{font-size:22px;font-weight:700;letter-spacing:.5px}
header.site .sub{margin-top:6px;font-size:13px;opacity:.85}
.badges{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:11px;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35)}
main{padding-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
h2{font-size:18px;margin-bottom:12px;padding-left:10px;border-left:4px solid var(--accent)}
h3{font-size:15px;margin:16px 0 8px;color:#111827}
h3:first-of-type{margin-top:0}
p{font-size:14.5px;color:#374151;margin-bottom:8px;text-align:justify}
.small{font-size:12.5px;color:var(--sub)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:4px;margin-left:6px;vertical-align:1px}
.tag.solid{background:var(--ok-soft);color:var(--ok)}
.tag.infer{background:var(--warn-soft);color:var(--warn)}
.tl{list-style:none;border-left:2px solid var(--line);margin-left:8px;padding-left:18px}
.tl li{position:relative;padding:0 0 14px 4px;font-size:14px;color:#374151}
.tl li::before{content:"";position:absolute;left:-25px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 2px var(--accent-soft)}
.tl .t{font-weight:600;color:var(--accent);font-size:13.5px;display:block}
.sent{display:flex;align-items:center;margin:7px 0;font-size:13.5px}
.sent .lb{width:130px;flex-shrink:0;color:#374151}
.sent .bar{flex:1;height:18px;background:#eef1f5;border-radius:9px;overflow:hidden}
.sent .fill{height:100%;border-radius:9px;background:linear-gradient(90deg,#2f7fd1,#1e5aa8)}
.sent .pct{width:52px;text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.quote{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;margin:8px 0;font-size:13.5px;color:#1f2937}
.quote .who{color:var(--sub);font-size:12px;display:block;margin-top:3px}
.warn-box{background:var(--warn-soft);border:1px solid #f5d78e;border-radius:8px;padding:12px 14px;font-size:13.5px;color:#78350f}
.danger-box{background:var(--danger-soft);border:1px solid #f1b0b0;border-radius:8px;padding:12px 14px;font-size:13.5px;color:#7f1d1d}
ol.nums,ul.dots{padding-left:22px;font-size:14px;color:#374151}
ol.nums li,ul.dots li{margin-bottom:7px}
table.src{width:100%;border-collapse:collapse;font-size:12.5px}
table.src td,table.src th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.src a{color:var(--accent);word-break:break-all}
footer.site{text-align:center;color:var(--sub);font-size:12px;padding:24px 16px 40px}
footer.site .line{display:inline-block;border-top:1px solid var(--line);padding:0 18px}
/* 仪表盘 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid .cell{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fafbfd}
.grid .cell h4{font-size:13.5px;color:#111827;margin-bottom:6px}
.grid .cell.full{grid-column:1/-1}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub);margin:6px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.bar-row{display:flex;align-items:center;margin:5px 0;font-size:12.5px}
.bar-row .nm{width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#374151}
.bar-row .tk{flex:1;height:12px;background:#eef1f5;border-radius:6px;overflow:hidden;display:flex}
.bar-row .tk i{display:block;height:100%}
.bar-row .vl{width:66px;text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.status-dots{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.status-dots span{background:var(--ok-soft);color:var(--ok);padding:1px 8px;border-radius:999px}
.status-dots span.audit{background:var(--warn-soft);color:var(--warn)}
.chartbox{position:relative}
.chartbox svg{display:block}
.empty{padding:22px 0;text-align:center;color:var(--sub);font-size:12.5px}
/* 口令门 */
#gate{position:fixed;inset:0;background:#0f2a4d;display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}
#gate .box{background:#fff;border-radius:14px;padding:32px 30px;max-width:380px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#gate h1{font-size:17px;margin-bottom:6px}
#gate .small{margin-bottom:18px}
#gate input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;text-align:center;outline:none}
#gate input:focus{border-color:var(--accent)}
#gate button{margin-top:12px;width:100%;padding:10px;background:var(--accent);color:#fff;border:0;border-radius:8px;font-size:15px;cursor:pointer}
#gate .err{color:var(--danger);font-size:12.5px;margin-top:8px;display:none}
#content{display:none}
@media (max-width:640px){.grid{grid-template-columns:1fr}.sent .lb{width:104px;font-size:12.5px}header.site h1{font-size:19px}}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h1>🔒 访问受限内容</h1>
    <div class="small">本页面为内部临时发布，请输入访问口令</div>
    <input type="password" id="pw" placeholder="访问口令" autocomplete="off">
    <button id="unlock">进入</button>
    <div class="err" id="err">口令不正确</div>
  </div>
</div>

<div id="content">
<header class="site">
  <div class="wrap">
    <h1 id="docTitle"></h1>
    <div class="sub" id="docMeta"></div>
    <div class="badges" id="badges"></div>
  </div>
</header>
<main class="wrap" id="main"></main>
<footer class="site">
  <div class="line" id="footerNote"></div>
</footer>
</div>

<script>
(async () => {
  const data = await (await fetch('data.json')).json();
  const PW_HASH = data.passwordHash;

  async function sha256(s){const b=new TextEncoder().encode(s);const d=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,'0')).join('');}

  const unlock = async () => {
    const v = document.getElementById('pw').value.trim();
    if ((await sha256(v)) === PW_HASH) {
      sessionStorage.setItem('hndx_unlock','1');
      document.getElementById('gate').style.display='none';
      document.getElementById('content').style.display='block';
      window.scrollTo(0,0);
    } else {
      document.getElementById('err').style.display='block';
    }
  };
  document.getElementById('unlock').onclick = unlock;
  document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });
  if (sessionStorage.getItem('hndx_unlock')==='1') {
    document.getElementById('gate').style.display='none';
    document.getElementById('content').style.display='block';
  }

  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const main = document.getElementById('main');

  // ===== 图表工具（纯SVG/CSS，无外部依赖） =====
  const COLORS = ['#1e5aa8','#e11d48','#d97706','#059669','#6b7280'];

  function lineChart(pts, w=540, h=150) {
    if (!pts || pts.length < 2) return '<div class="empty">样本不足（需至少2轮数据，随监测自动累积）</div>';
    const padL=30, padR=14, padT=12, padB=20;
    const vals = pts.map(p=>p.v);
    const min = Math.min(...vals), max = Math.max(...vals);
    const span = (max-min) || 1;
    const x = i => padL + i*(w-padL-padR)/Math.max(1,pts.length-1);
    const y = v => padT + (h-padT-padB) - (v-min)/span*(h-padT-padB);
    const path = pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
    const area = path + ' L' + x(pts.length-1).toFixed(1) + ' ' + (h-padB) + ' L' + padL + ' ' + (h-padB) + ' Z';
    const dots = pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="#1e5aa8"><title>${esc(p.l)}：${p.v}</title></circle>`).join('');
    const grid = [0,1,2,3].map(k=>{const vv=min+span*k/3;const yy=y(vv).toFixed(1);return `<line x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}" stroke="#eef1f5"/><text x="4" y="${Number(yy)+3}" font-size="9" fill="#9ca3af">${Math.round(vv)}</text>`;}).join('');
    const labels = [pts[0], pts[pts.length-1]].map((p,i)=>`<text x="${i===0?padL:w-padR}" text-anchor="${i===0?'start':'end'}" y="${h-6}" font-size="9" fill="#6b7280">${esc(p.l)}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${grid}<path d="${area}" fill="#1e5aa8" opacity="0.07"/><polyline points="${path}" fill="none" stroke="#1e5aa8" stroke-width="2"/>${dots}${labels}</svg>`;
  }

  function donut(segs, size=110) {
    const total = Object.values(segs||{}).reduce((a,b)=>a+b,0);
    if (!total) return '<div class="empty">样本不足</div>';
    const r = size/2 - 10, cx = size/2, cy = size/2;
    let angle = -Math.PI/2; const parts = [];
    const names = Object.keys(segs);
    names.forEach((k,i)=>{
      const frac = segs[k]/total;
      const a1 = angle, a2 = angle + frac*Math.PI*2;
      const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1), x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
      parts.push(`<path d="M${cx} ${cy} L${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${frac>0.5?1:0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z" fill="${COLORS[i%5]}"><title>${esc(k)} ${segs[k]}条</title></path>`);
      angle = a2;
    });
    parts.push(`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">${total}</text>`);
    parts.push(`<text x="${cx}" y="${cy+10}" text-anchor="middle" font-size="8" fill="#9ca3af">样本量</text>`);
    const legend = names.map((k,i)=>`<span><i style="background:${COLORS[i%5]}"></i>${esc(k)} ${segs[k]}</span>`).join('');
    return `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex-shrink:0">${parts.join('')}</svg><div class="legend" style="flex-direction:column;align-items:flex-start;gap:4px">${legend}</div></div>`;
  }

  function hbars(items, unit='') {
    if (!items || !items.length) return '<div class="empty">样本不足</div>';
    const max = Math.max(...items.map(i=>i.v)) || 1;
    return items.slice(0, 8).map(i=>`<div class="bar-row"><div class="nm" title="${esc(i.tip||i.l)}">${esc(i.l)}</div><div class="tk"><i style="width:${(i.v/max*100).toFixed(0)}%;background:linear-gradient(90deg,#2f7fd1,#1e5aa8)"></i></div><div class="vl">${i.v}${unit}</div></div>`).join('');
  }

  function stackedBars(rows) {
    if (!rows || !rows.length) return '<div class="empty">样本不足</div>';
    const max = Math.max(...rows.map(r=>(r.a||0)+(r.b||0))) || 1;
    return rows.map(r=>`<div class="bar-row"><div class="nm">${esc(r.l)}</div><div class="tk"><i style="width:${((r.a||0)/max*100).toFixed(0)}%;background:#b9cfe8"></i><i style="width:${((r.b||0)/max*100).toFixed(0)}%;background:#1e5aa8"></i></div><div class="vl">${r.a||0}${r.b?'(+'+r.b+')':''}</div></div>`).join('');
  }

  // ===== 页面骨架渲染 =====
  document.getElementById('docTitle').textContent = data.title;
  document.getElementById('docMeta').textContent = data.meta;
  document.getElementById('badges').innerHTML = data.badges.map(b=>`<span class="badge">${b}</span>`).join('');

  main.innerHTML += `<div class="card"><h2>${esc(data.notice.title)}</h2><p>${esc(data.notice.body)}</p></div>`;
  main.innerHTML += `<div class="card"><h2>${esc(data.timeline.title)}</h2>
    <ul class="tl">${data.timeline.items.map(i=>`<li><span class="t">${esc(i.time)}</span>${esc(i.event)}</li>`).join('')}</ul>
    ${data.timeline.note ? `<p class="small">${esc(data.timeline.note)}</p>`:''}</div>`;
  main.innerHTML += `<div class="card"><h2>${esc(data.notice2.title)}</h2>
    <ul class="dots">${data.notice2.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`;

  // ===== 最新监测快照 =====
  if (data.snapshot) {
    const s = data.snapshot;
    const cdTag = s.cdp ? '<span class="tag solid">本机会话在线</span>' : '<span class="tag infer">本机会话离线（本轮仅公开源）</span>';
    main.innerHTML += `<div class="card"><h2>最新监测快照 ${cdTag}</h2>
      <p class="small">本轮时间：${esc(s.time)}</p>
      <p>${esc(s.summary)}</p></div>`;
  }

  // ===== 报告全文 =====
  const hist = data.history || [];
  const sn = data.snapshot || {};
  for (const p of data.platforms) {
    const tag = p.solid ? '<span class="tag solid">实测采集</span>' : '<span class="tag infer">部分推断</span>';
    const quotes = p.quotes ? p.quotes.map(q=>`<div class="quote">${esc(q.text)}<span class="who">${esc(q.who)}</span></div>`).join('') : '';
    let viz = '';
    if (p.name.includes('小红书')) {
      viz = `<div class="grid" style="margin-top:6px">
        <div class="cell"><h4>相关笔记可见数趋势</h4>${lineChart(hist.map(h=>({l:h.t, v:h.xhs?.n||0})).filter(x=>x.v>0))}</div>
        <div class="cell"><h4>榜首笔记点赞趋势</h4>${lineChart(hist.map(h=>({l:h.t, v:h.xhs?.top||0})).filter(x=>x.v>0))}</div>
        <div class="cell"><h4>笔记类型分布（最新轮）</h4>${donut(sn.xhs?.types)}</div>
        <div class="cell"><h4>本轮高热度笔记</h4>${hbars((sn.xhs?.cards||[]).map(c=>({l:c.title.slice(0,18), v:parseInt(String(c.like).replace(/[^0-9]/g,''))||1, tip:'@'+c.author})).filter(x=>x.v>1).slice(0,8),'赞')}</div>
        <div class="cell full"><h4>笔记评论区采样（点赞最高2篇）</h4>${(sn.xhs?.comments||[]).map(nb=>`<p class="small" style="font-weight:600">《${esc(nb.note.title)}》${esc(nb.note.like)}赞</p>` + nb.comments.slice(0,6).map(cm=>`<div class="quote">${esc(cm.text)}<span class="who">@${esc(cm.name)}${cm.like&&cm.like!=='赞'?' · '+esc(cm.like)+'赞':''}</span></div>`).join('')).join('') || '<div class="empty">样本不足</div>'}</div>
      </div>`;
    } else if (p.name.includes('微博')) {
      const wbRows = hist.map(h=>({l:h.t, a:h.wb?.n||0, b:h.wb?.new||0})).filter(r=>r.a>0);
      viz = `<div class="grid" style="margin-top:6px">
        <div class="cell"><h4>每轮监测条数（新增加深）</h4><div class="legend"><span><i style="background:#b9cfe8"></i>累计条数</span><span><i style="background:#1e5aa8"></i>本轮新增</span></div>${stackedBars(wbRows)}</div>
        <div class="cell"><h4>情感分布（最新轮）</h4>${donut(sn.weibo?.senti)}</div>
        <div class="cell full"><h4>高赞帖TOP榜（跨轮累计 · 点赞量）</h4>${hbars((data.wbPool||[]).map(p=>({l:'@'+p.user, v:p.likes||0, tip:p.text})).filter(x=>x.v>0),'赞')}</div>
        <div class="cell full"><h4>本轮新增帖子</h4>${(sn.weibo?.newPosts||[]).slice(0,6).map(x=>`<div class="quote">${esc(x.text)}<span class="who">@${esc(x.user)} · ${esc(x.likes)}赞 · ${esc(x.time)}</span></div>`).join('') || '<div class="empty">本轮无新增</div>'}</div>
      </div>`;
    } else if (p.name.includes('微信公众号')) {
      const wxRows = hist.map(h=>({l:h.t, a:h.wx?.n||0, b:h.wx?.new||0})).filter(r=>r.a>0);
      viz = `<div class="grid" style="margin-top:6px">
        <div class="cell"><h4>累计篇数与每轮新增</h4>${stackedBars(wxRows)}</div>
        <div class="cell"><h4>最新动态</h4>${sn.weixin?.ok ? (sn.weixin.newItems||[]).slice(0,6).map(i=>`<div class="quote">${esc(i.account)}《${esc(i.title.slice(0,24))}》<span class="who">${esc(i.time)}</span></div>`).join('') + (sn.weixin.latest ? `<p class="small">最新：${esc(sn.weixin.latest.account)}《${esc(sn.weixin.latest.title.slice(0,30))}》 ${esc(sn.weixin.latest.time)}</p>` : '') : '<div class="empty">样本不足</div>'}</div>
        <div class="cell full"><h4>文章留言采样（最新2篇）</h4>${sn.weixin?.ok ? (sn.weixin.withComments||[]).map(a=>`<p class="small" style="font-weight:600">${esc(a.account)}《${esc(a.title.slice(0,26))}》${esc(a.time)}</p>` + (a.comments?.length ? a.comments.slice(0,5).map(cm=>`<div class="quote">${esc(cm.text)}<span class="who">${esc(cm.author)}${cm.like?' · '+cm.like+'赞':''}</span></div>`).join('') : '<p class="small">该文未开放留言或暂无精选留言</p>')).join('') : '<div class="empty">样本不足</div>'}</div>
      </div>`;
    }
    main.innerHTML += `<div class="card"><h2>${esc(p.name)}${tag}</h2>
      ${p.paras.map(x=>`<p>${esc(x)}</p>`).join('')}
      ${quotes}
      ${viz}</div>`;
  }

  main.innerHTML += `<div class="card"><h2>${esc(data.overview.title)}</h2>
    <h3>${esc(data.overview.sentTitle)}</h3>
    ${data.overview.sent.map(x=>`<div class="sent"><div class="lb">${esc(x.label)}</div><div class="bar"><div class="fill" style="width:${x.pct}%"></div></div><div class="pct">${x.pct}%</div></div>`).join('')}
    <h3>${esc(data.overview.stageTitle)}</h3>
    <ul class="dots">${data.overview.stages.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <h3>${esc(data.overview.disputeTitle)}</h3>
    <ul class="dots">${data.overview.disputes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;

  main.innerHTML += `<div class="card"><h2>${esc(data.rumors.title)}</h2><ul class="dots">${data.rumors.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`;
  main.innerHTML += `<div class="card"><h2>${esc(data.risk.title)}</h2>
    <div class="warn-box">${esc(data.risk.intro)}</div>
    <ul class="dots" style="margin-top:10px">${data.risk.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
    <h3>${esc(data.sug.title)}</h3>
    <ul class="dots">${data.sug.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`;

  main.innerHTML += `<div class="card"><h2>${esc(data.sources.title)}</h2>
    <table class="src">${data.sources.items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.label)}</td><td>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a>`:'—'}</td></tr>`).join('')}</table></div>`;

  if (data.updates && data.updates.length) {
    main.innerHTML += `<div class="card"><h2>更新日志</h2>
      <ul class="tl">${data.updates.map(u=>`<li><span class="t">${esc(u.t)}</span>${esc(u.s)}</li>`).join('')}</ul></div>`;
  }

  main.innerHTML += `<div class="card danger-box">${esc(data.disclaimer)}</div>`;
  document.getElementById('footerNote').textContent = data.footer;
})();
</script>
</body>
</html>
